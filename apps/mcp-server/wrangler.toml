name = "godly-mcp-test"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "testapi.godly.design/mcp*", zone_name = "godly.design" },
  { pattern = "testapi.godly.design/health", zone_name = "godly.design" },
]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_TEST_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_TEST_KV_PREVIEW_ID"

[vars]
PAYLOAD_CMS_URL = "https://testcms.godly.design"
GODLY_CHECKOUT_URL = "https://test.godly.design/pricing"
MCP_ALLOWED_ORIGINS = "https://test.godly.design,http://localhost:4321"

# Secrets (`wrangler secret put`):
#   INTERNAL_MCP_SECRET
# Optional local-only bypass (never set in production):
#   GODLY_DEV_API_KEY

[observability]
enabled = true
